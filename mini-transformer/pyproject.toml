[project]
name = "mini-transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.0",
    "matplotlib>=3.10.9",
    "numpy>=1.24.4",
    "torch>=2.5.1",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp[curl-cffi]>=2024.10.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_transformer"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
